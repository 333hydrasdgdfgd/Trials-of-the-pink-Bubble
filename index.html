<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASS Challenge Game | Tower of Trials</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f48fb1, #e91e8c, #c2185b, #880e4f);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      width: 90%;
      max-width: 600px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(136,14,79,0.4);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      margin-bottom: 20px;
      font-size: 3.5rem;
      text-shadow: 0 2px 10px rgba(255,255,255,0.3);
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    h3 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    input {
      width: 80%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 1rem;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #1e3c72;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      min-width: 180px;
    }

    button:hover {
      background: #fce4ec;
      color: #880e4f;
      transform: scale(1.05);
    }

    button:disabled {
      background: #aaaaaa;
      color: #666666;
      cursor: not-allowed;
      transform: none;
      opacity: 0.5;
    }

    .question {
      font-size: 1.6rem;
      margin: 20px 0;
      line-height: 1.5;
    }

    .result {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .correct { color: #7CFF7C; }
    .wrong   { color: #FF7C7C; }

    .answer {
      color: #fce4ec;
      margin-top: 10px;
    }

    .info {
      margin: 10px 0;
      opacity: 0.9;
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      text-align: left;
    }

    .mode-text { flex: 1; }

    .mode-text h3 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .mode-text p {
      font-size: 0.95rem;
      opacity: 0.85;
      line-height: 1.4;
    }

    .mode-button { flex-shrink: 0; }

    .mechanic-block {
      background: rgba(255,255,255,0.08);
      border-left: 3px solid #fce4ec;
      padding: 12px 16px;
      margin: 12px 0;
      text-align: left;
      border-radius: 0 8px 8px 0;
    }

    .mechanic-block h3 {
      color: #fce4ec;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .mechanic-block p {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.9;
    }

    .rule-box {
      background: rgba(136,14,79,0.35);
      border: 1px solid rgba(252,228,236,0.5);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 16px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
    }

    .rule-box strong { color: #fce4ec; }

    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 12px 0;
    }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid white;
      background: transparent;
      transition: background 0.3s;
    }

    .progress-dot.done {
      background: #fce4ec;
      border-color: #fce4ec;
    }

    .level-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .level-grid button { min-width: 130px; }
  </style>
</head>
<body>

  <div class="container" id="app"></div>

  <script>

    let userName       = "";
    let completedModes = {};
    let selectedMode   = "";
    let selectedLevel  = 1;
    let currentQuestion = "";
    let currentAnswer   = "";

    const MODES = ["Brain", "Heart", "Courage"];

    // =============== DATA ===============
    const brainQuestions = {
      1: [
        ["12 + 8", "20"], ["7 × 6", "42"], ["15 + 9", "24"],
        ["9 × 4", "36"], ["18 + 11", "29"], ["5 × 8", "40"]
      ],
      2: [
        ["₱120 with 15% discount", "102"], ["2, 4, 8, 16, ?", "32"],
        ["25 - 7 × 2", "11"], ["How many sides does an octagon have?", "8"],
        ["5, 10, 20, 40, ?", "80"], ["₱250 with 10% discount", "225"]
      ],
      3: [
        ["120 to 150 — percentage increase?", "25"], ["Profit ₱5000 - Expenses ₱3500", "1500"],
        ["A shirt costs ₱800, after 25% off?", "600"],
        ["If 4 workers finish in 3 hours, workers needed in 2 hours?", "6"],
        ["Solve 4x = 32, x = ?", "8"], ["15% of 300", "45"]
      ]
    };

    const heartChallenges = {
      1: [
        "Sing 10 seconds of your favorite song and take a photo/video.",
        "Take a selfie with a friend (instant pose).",
        "Give a quick compliment and take a selfie right after.",
        "Do a ‘peace sign’ group photo with someone nearby.",
        "Take a creative pose photo with a stranger or friend (with consent)."
      ],
      2: [
        "Say 'Good morning/afternoon' to a guard or staff and take a photo with them (with permission).",
        "Take a photo with someone you don’t usually talk to.",
        "Do a quick high-five with someone and capture it.",
        "Take a group hug photo with friends (with consent).",
        "Take a selfie with someone you just met at the booth."
      ],
      3: [
        "Give a quick appreciation to someone and take a photo together.",
        "Take a ‘friendship photo’ with a random willing participant.",
        "Do a fun pose with a stranger or friend and take a photo.",
        "Take a group photo showing team spirit at the booth."
      ]
    };

    const courageChallenges = {
      1: [
        "Sing 10 seconds of a song in front of someone and record it.",
        "Do a confident pose and take a photo instantly.",
        "Say 'I am confident!' and take a selfie.",
        "Take a funny but confident pose photo in public.",
        "Wave and greet someone loudly and take a photo right after."
      ],
      2: [
        "Approach someone and ask for a quick photo together.",
        "Do a short 5–10 second shout of your favorite cheer and record it.",
        "Invite a stranger or friend for a quick photo challenge.",
        "Take a group cheer photo (pose + shout).",
        "Ask a guard/staff for a photo with you (with permission)."
      ],
      3: [
        "Do a short 10–15 second performance (sing/dance) and record it.",
        "Lead a quick group pose or cheer and take a video/photo.",
        "Approach a group and initiate a group photo challenge."
      ]
    };

    // =============== HELPERS ===============
    function randomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function render(html) {
      document.getElementById("app").innerHTML = html;
    }

    function forbiddenLevels(mode) {
      return Object.entries(completedModes)
        .filter(([m]) => m !== mode)
        .map(([, l]) => l);
    }

    function allThreeDone() {
      return MODES.every(m => completedModes[m] !== undefined);
    }

    // =============== 1. START SCREEN ===============
    function startScreen() {
      render(`
        <h1>Trials of the pink Bubble</h1>
        <p style="font-size: 1.1rem; margin-bottom: 20px; line-height: 1.6;">
          Welcome to the <strong>Trials of the Pink Bubble</strong>.<br><br>
          Are you a good witch — or are you simply brave enough to find out?<br><br>
          Three enchantments await you: gifts of <strong>Wisdom</strong>,
          gifts of <strong>Heart</strong>, and gifts of <strong>Courage</strong>.
          Together they hold the magic to open the gates.<br><br>
          Step forward. The wand is already in motion.
        </p>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <br>
        <button onclick="saveName()">Begin the Journey</button>
      `);
    }

    function saveName() {
      const input = document.getElementById("nameInput");
      userName = input ? input.value.trim() : "";
      if (userName !== "") {
        mechanicsScreen();
      } else {
        alert("Please enter your name to begin.");
      }
    }

    // =============== 2. MECHANICS SCREEN ===============
    function mechanicsScreen() {
      render(`
        <h1>How It Works</h1>
        <h2>Welcome, ${userName}!</h2>

        <div class="mechanic-block">
          <h3>Three Trials, One Journey</h3>
          <p>You must complete all three challenges — Brain, Heart, and Courage — to win. You may choose the order, but none may be skipped.</p>
        </div>

        <div class="mechanic-block">
          <h3>Three Levels of Difficulty</h3>
          <p>Each challenge has three difficulty levels. Choose wisely — the magic you pick here shapes the path ahead.</p>
        </div>

        <div class="rule-box">
          <strong>The Rule:</strong> No two challenges may share the same level.
          If you choose <strong>Level 1</strong> for Brain, you must face
          <strong>Level 2 or 3</strong> for Heart and Courage — and so on.
        </div>

        <div class="mechanic-block">
          <h3>🧠 Brain Challenge</h3>
          <p>Answer logic and math questions. Get it right to move on.</p>
        </div>

        <div class="mechanic-block">
          <h3>❤️ Heart Challenge</h3>
          <p>Receive a real-world kindness task. Complete it with sincerity.</p>
        </div>

        <div class="mechanic-block">
          <h3>💪 Courage Challenge</h3>
          <p>Accept a brave dare. Step outside your comfort zone and own it.</p>
        </div>

        <br>
        <button onclick="chooseMode()">Proceed</button>
      `);
    }

    // =============== 3. MODE SELECTION ===============
    function chooseMode() {
      const done = Object.keys(completedModes).length;
      const dots = MODES.map(m =>
        `<div class="progress-dot ${completedModes[m] !== undefined ? 'done' : ''}"></div>`
      ).join('');

      const cards = MODES.map(m => {
        const isDone = completedModes[m] !== undefined;
        const icon = m === 'Brain' ? '🧠' : m === 'Heart' ? '❤️' : '💪';
        const desc = m === 'Brain'
          ? 'Logic, math & analytical thinking.'
          : m === 'Heart'
          ? 'Kindness, empathy & real-world connection.'
          : 'Bravery, confidence & bold action.';
        return `
          <div class="mode-row">
            <div class="mode-text">
              <h3>${icon} ${m} Challenge${isDone ? ' — Done' : ''}</h3>
              <p>${desc}</p>
            </div>
            <div class="mode-button">
              <button onclick="${isDone ? '' : `chooseLevel('${m}')`}" ${isDone ? 'disabled' : ''}>
                ${isDone ? 'Complete' : 'Play'}
              </button>
            </div>
          </div>`;
      }).join('');

      render(`
        <h1>Welcome, ${userName}!</h1>
        <h2>Choose a Challenge</h2>
        <div class="progress-bar">${dots}</div>
        <p class="info">${done} of 3 challenges completed</p>
        ${cards}
        <br>
        <button onclick="mechanicsScreen()" style="min-width:140px;font-size:0.85rem;">Review Rules</button>
      `);
    }

    // =============== 4. LEVEL SELECTION ===============
    function chooseLevel(mode) {
      selectedMode = mode;
      const forbidden = forbiddenLevels(mode);

      const btns = [1, 2, 3].map(l => {
        const blocked = forbidden.includes(l);
        return `<button onclick="${blocked ? '' : `playGame(${l})`}" ${blocked ? 'disabled' : ''}>
          Level ${l}${blocked ? ' — Taken' : ''}
        </button>`;
      }).join('');

      const forbidMsg = forbidden.length > 0
        ? `<p class="info" style="color:#fce4ec;">Level${forbidden.length > 1 ? 's' : ''} ${forbidden.join(' & ')} already used by another challenge.</p>`
        : '';

      render(`
        <h1>${mode} Challenge</h1>
        <h2>Choose Difficulty Level</h2>
        <p class="info" style="line-height:1.5;margin-bottom:10px;">
          No two challenges can share the same level.
        </p>
        ${forbidMsg}
        <div class="level-grid">${btns}</div>
        <br>
        <button onclick="chooseMode()">Back to Challenges</button>
      `);
    }

    // =============== 5. PLAY GAME ===============
    function playGame(level) {
      selectedLevel = level;

      if (selectedMode === "Brain") {
        generateBrainQuestion();
      } else if (selectedMode === "Heart") {
        const pool = heartChallenges[selectedLevel] || ["Spread kindness to someone nearby."];
        const challenge = randomItem(pool);
        render(`
          <h1>Heart Challenge</h1>
          <div class="info">Player: ${userName} &nbsp;|&nbsp; Level ${selectedLevel}</div>
          <div class="question">${challenge}</div>
          <p class="info">Complete this task, then mark it done.</p>
          <button onclick="markComplete()">Mark as Complete</button>
          <br>
          <button onclick="playGame(${selectedLevel})">Next Challenge</button>
          <button onclick="chooseMode()">Change Mode</button>
        `);
      } else if (selectedMode === "Courage") {
        const pool = courageChallenges[selectedLevel] || ["Step forward and do one brave act."];
        const challenge = randomItem(pool);
        render(`
          <h1>Courage Challenge</h1>
          <div class="info">Player: ${userName} &nbsp;|&nbsp; Level ${selectedLevel}</div>
          <div class="question">${challenge}</div>
          <p class="info">Face this dare, then mark it done.</p>
          <button onclick="markComplete()">Mark as Complete</button>
          <br>
          <button onclick="playGame(${selectedLevel})">Next Challenge</button>
          <button onclick="chooseMode()">Change Mode</button>
        `);
      }
    }

    // =============== 6. BRAIN QUESTION ===============
    function generateBrainQuestion() {
      const pool = brainQuestions[selectedLevel];
      const q = randomItem(pool);
      currentQuestion = q[0];
      currentAnswer   = q[1];

      render(`
        <h1>Brain Challenge</h1>
        <div class="info">Player: ${userName} &nbsp;|&nbsp; Level ${selectedLevel}</div>
        <div class="question">${currentQuestion}</div>
        <input type="text" id="answerInput" placeholder="Enter Answer">
        <br>
        <button onclick="checkAnswer()">Submit Answer</button>
        <button onclick="showAnswer()">Show Correct Answer</button>
        <div id="result" class="result"></div>
        <div id="answer" class="answer"></div>
        <br>
        <button onclick="generateBrainQuestion()">Next Question</button>
        <button onclick="chooseMode()">Change Mode</button>
      `);
    }

    function checkAnswer() {
      const input = document.getElementById("answerInput");
      const resultDiv = document.getElementById("result");
      if (!input || !resultDiv) return;
      const userAnswer = input.value.trim();
      if (userAnswer.toLowerCase() === currentAnswer.toLowerCase()) {
        resultDiv.innerHTML = "Correct! Well done, champion!";
        resultDiv.className = "result correct";
        setTimeout(() => {
          const r = document.getElementById("result");
          if (r) r.innerHTML += `<br><button onclick="markComplete()" style="margin-top:12px;">Mark Trial Complete</button>`;
        }, 800);
      } else {
        resultDiv.innerHTML = "Wrong answer. A new question is loading...";
        resultDiv.className = "result wrong";
        setTimeout(() => generateBrainQuestion(), 1500);
      }
    }

    function showAnswer() {
      const d = document.getElementById("answer");
      if (d) d.innerHTML = `Correct Answer: ${currentAnswer}`;
    }

    // =============== 7. MARK COMPLETE ===============
    function markComplete() {
      completedModes[selectedMode] = selectedLevel;
      if (allThreeDone()) {
        victoryScreen();
      } else {
        chooseMode();
      }
    }

    // =============== 8. VICTORY ===============
    function victoryScreen() {
      const summary = MODES.map(m =>
        `<p class="info" style="color:#fce4ec;">${m} — Level ${completedModes[m]} complete</p>`
      ).join('');

      render(`
        <h1>You Did It!</h1>
        <h2>All Three Trials Complete</h2>
        <br>
        <p style="font-size: 1.1rem; line-height: 1.7;">
          You always had the wisdom, the heart, and the courage within you,
          <strong>${userName}</strong>. You simply needed to believe it.
        </p>
        <br>
        ${summary}
        <br>
        <button onclick="restart()">Play Again</button>
      `);
    }

    // =============== 9. RESTART ===============
    function restart() {
      userName       = "";
      completedModes = {};
      selectedMode   = "";
      selectedLevel  = 1;
      startScreen();
    }

    // =============== INIT ===============
    startScreen();

  </script>
</body>
</html>
